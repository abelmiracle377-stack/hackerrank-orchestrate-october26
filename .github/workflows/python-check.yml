name: Python solution checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q code
      - name: Run synthetic regression cases
        run: python -m unittest discover -s code/evaluation -p 'test_*.py'
      - name: Generate prediction file
        run: python code/main.py
      - name: Validate output contract
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          p=Path("output.csv")
          with p.open(encoding="utf-8", newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==518, f"expected 518 rows, got {len(rows)}"
          assert [r["case_id"] for r in rows] == sorted(r["case_id"] for r in rows)
          for row in rows:
              assert row["deletion_status"] in {"COMPLETE","INCOMPLETE","NOT_APPLICABLE"}
              steps=json.loads(row["steps_json"])
              assert isinstance(steps,list)
              for n,step in enumerate(steps,1):
                  assert step["step_no"]==n
                  assert step["phase"] in {"FINDING","REMEDIATION","VERIFICATION"}
          PY
      - name: Generate sample prediction
        run: python code/main.py --requests dataset/sample_deletion_requests.csv --output sample_prediction.csv
      - name: Build sample evaluation report
        run: python code/evaluation/main.py --predicted sample_prediction.csv --expected dataset/sample_output.csv
      - name: Package code.zip
        run: zip -r code.zip code -x '*/__pycache__/*' '*.pyc'
      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: deletion-audit-submission-bundle
          path: |
            code.zip
            output.csv
            sample_prediction.csv
            dataset/sample_output.csv
            dataset/sample_deletion_requests.csv
            code/evaluation/evaluation_report.md
